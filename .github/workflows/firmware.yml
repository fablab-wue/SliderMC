name: Firmware UF2

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (for example v1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - pico
          - picow
          - rp2040zero
          - pico2
          - pico2w
          - rp2350zero
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._+-]+$'; then
            echo "Tag must look like v1.0 (got: $tag)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.env }}
        run: python -m platformio run -e ${{ matrix.env }}

      - name: Rename UF2
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ENV_NAME: ${{ matrix.env }}
        run: cp ".pio/build/${ENV_NAME}/firmware.uf2" "SliderMC-${TAG}-${ENV_NAME}.uf2"

      - uses: actions/upload-artifact@v4
        with:
          name: uf2-${{ matrix.env }}
          path: SliderMC-*.uf2
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._+-]+$'; then
            echo "Tag must look like v1.0 (got: $tag)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: uf2-*
          path: dist
          merge-multiple: true

      - name: Check assets
        run: |
          shopt -s nullglob
          files=(dist/*.uf2)
          echo "Found ${#files[@]} UF2 file(s):"
          printf '  %s\n' "${files[@]}"
          if [ "${#files[@]}" -ne 6 ]; then
            echo "Expected 6 UF2 files"
            exit 1
          fi

      - name: Write release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cat > notes.md << EOF
          ## Flash without compiling

          1. Download the UF2 that matches your board.
          2. Hold **BOOTSEL**, plug in USB, then release BOOTSEL.
          3. Copy the UF2 onto the drive that appears.
             - RP2040 (Pico, Pico W, RP2040-Zero): drive name \`RPI-RP2\`
             - RP2350 (Pico 2, Pico 2 W, RP2350-Zero): drive name \`RP2350\`
          4. The board reboots into the new firmware.

          | File | Board |
          |------|--------|
          | \`SliderMC-${TAG}-pico.uf2\` | Raspberry Pi Pico (RP2040) |
          | \`SliderMC-${TAG}-picow.uf2\` | Raspberry Pi Pico W |
          | \`SliderMC-${TAG}-rp2040zero.uf2\` | Waveshare RP2040-Zero |
          | \`SliderMC-${TAG}-pico2.uf2\` | Raspberry Pi Pico 2 (RP2350) |
          | \`SliderMC-${TAG}-pico2w.uf2\` | Raspberry Pi Pico 2 W |
          | \`SliderMC-${TAG}-rp2350zero.uf2\` | Waveshare RP2350-Zero |

          Pico and Zero share a chip family. The bootloader accepts either file on that chip, and the wrong one uses the wrong pins. Match the file to the board.

          A UF2 flash installs the application only. If the board has no \`/mc.ini\` yet, it boots with the compiled defaults. An existing \`/mc.ini\` on LittleFS is kept. Factory \`data/mc.ini\` still needs a filesystem upload from a source build (\`pio run -t uploadfs\`).
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/*.uf2 --clobber
          else
            gh release create "$TAG" dist/*.uf2 --title "SliderMC ${TAG}" --notes-file notes.md
          fi
