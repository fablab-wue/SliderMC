; SliderMC — Raspberry Pi Pico motor controller
; Open this folder in VS Code with the PlatformIO IDE extension.

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
board_build.filesystem_size = 65536
monitor_speed = 115200
build_flags =
  -Iinclude
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
  ; newlib-nano omits float printf unless pulled in (CG/GS/IP/%.2f/%.3g)
  -Wl,-u_printf_float
build_src_filter =
  +<*>
  -<motion/motion_stub.cpp>
  -<../test/*>

[env:pico]
board = rpipico
; BOARD_PICO is the pins.h default

[env:picow]
board = rpipicow
build_flags =
  ${env.build_flags}
  -DBOARD_PICO_W

[env:rp2040zero]
board = waveshare_rp2040_zero
build_flags =
  ${env.build_flags}
  -DBOARD_RP2040_ZERO
