; SliderMC — Raspberry Pi Pico motor controller
; Open this folder in VS Code with the PlatformIO IDE extension.

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = littlefs
board_build.filesystem_size = 65536
monitor_speed = 115200
build_flags =
  -Iinclude
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
  ; newlib-nano omits float printf unless pulled in (CG/GS/IP/%.2f/%.3g)
  -Wl,-u_printf_float
build_src_filter =
  +<*>
  -<motion/motion_stub.cpp>
  -<../test/*>

; --- RP2040: 133 MHz in-spec; PIO STEP SM stays 50 MHz via clkdiv ---

[env:pico]
board = rpipico
board_build.f_cpu = 133000000L
; BOARD_PICO is the pins.h default

[env:picow]
board = rpipicow
board_build.f_cpu = 133000000L
build_flags =
  ${env.build_flags}
  -DBOARD_PICO_W

[env:rp2040zero]
board = waveshare_rp2040_zero
board_build.f_cpu = 133000000L
build_flags =
  ${env.build_flags}
  -DBOARD_RP2040_ZERO

; --- RP2350: 150 MHz default; same 50 MHz STEP SM (clkdiv = clk_sys / 50e6) ---
; Pico 2 / 2 W reuse the Pico header map. RP2350 Mini is Waveshare RP2350-Zero.

[env:pico2]
board = rpipico2
board_build.f_cpu = 150000000L
build_flags =
  ${env.build_flags}
  -DBOARD_PICO2

[env:pico2w]
board = rpipico2w
board_build.f_cpu = 150000000L
build_flags =
  ${env.build_flags}
  -DBOARD_PICO2_W

[env:rp2350mini]
board = waveshare_rp2350_zero
board_build.f_cpu = 150000000L
build_flags =
  ${env.build_flags}
  -DBOARD_RP2350_MINI
